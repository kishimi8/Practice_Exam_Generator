name: Build and Release Desktop App

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyinstaller-hooks-contrib PySide6

      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm build.spec

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: practice-exam-generator-macos
          path: dist/

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyinstaller-hooks-contrib PySide6

      - name: Build Windows app
        run: |
          python -m PyInstaller --noconfirm build.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: practice-exam-generator-windows
          path: dist/

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: >-
      ${
        needs.build-macos.result == 'success' &&
        needs.build-windows.result == 'success' &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/practice-exam-generator-macos/**
            release-artifacts/practice-exam-generator-windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
